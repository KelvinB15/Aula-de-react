<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketseat - React.js - Fundamentos</title>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        
        function listNames(){
          const names = ['Ana', 'Bia', 'Carlos', 'Daniel'];

          // invés de fazer função fora do return, faça dentro
          // invés de fazer variável para guardar o map, faça direto no return
          // invés de fazer função, faça index no map
          return (
            <ul>
              {names.map((name, index) => {
                return <li key={name}>{name}</li>
              })}
            </ul>
          )
        }
        function App() {
        return (
            <main class ="P-3">
                <h1>Modelo de Aplicação</h1>
                {listNames()}
            </main>
        )
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>

    
</body>
</html>
