<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketseat - React.js - Fundamentos</title>
</head>
<body>
    <div id="root"></div>

    <script scr="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const CounterContext = React.createContext();

        function CounterProvider({ children}) {
            const [savedCounts, setSavedCounts] = React.useState ([]);

            function saveCount(count) {
                setSavedCounts((prev) => [...prev, count]);
            }

            return (
                <CounterContext.Provider value={{ savedCounts, saveCount  }}>
                    {children}
                </CounterContext.Provider>
            )
        } 

        function Counter(){
          const [count, setCount] = React.useState (0);
            const { saveCount } = React.useContext (CounterContext);
          // Transforme as ações em função, fazendo assim o return ser mais limpo e simples
          function handleAdd(){
            setCount(count + 1);
          }

          function handleRemove(){
            setCount(count - 1);
          }

          return (
            <div>
              <h1>Contador: {count} </h1>
              <button type="button" onClick={handleAdd}>Adicionar</button>
              <button type="button" onClick={handleRemove}>Remover</button>
              <button onClick={() => saveCount(count)}>Salvar</button>
            </div>
          )
        }
      
        function CounterList() {
            const { savedCounts } = React.useContext(CounterContext);

            return (
                <div>
                    <h2>
                        Valores salvos
                    </h2>
                        <ul>
                            {savedCounts.map((value,index) =>
                            <li key={`item-${index}`}>
                                {value}
                            </li>
                        )}
                        </ul>
                </div>
            )
        }

        function App() {
        return (
            <main class ="P-3">
                <h1>Modelo de Aplicação</h1>
                <CounterProvider>
                    <Counter />
                        <hr />
                         <CounterList />
                </CounterProvider>
            </main>
        )
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>

    
</body>
</html>
