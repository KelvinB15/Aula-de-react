<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketseat - React.js - Fundamentos</title>
</head>
<body>
    <div id="root"></div>

    <script scr="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      
      function Alert1(){
       function handleAlertClick(event) {
        console.log(event);
         alert('Evento de click disparado!')}


        return (
          <button type="button" onClick={handleAlertClick}>
            Clique em mim
          </button>
        )
      }

      function Alert2(){
        function handleAlertClick(msg) {
          alert(msg)}
        return (
          <button type="button" onClick={function handleAlertClick() {
            alert('Evento de click disparado!')
          }}>
            Clique em mim
          </button>
        )
      }
        function App() {
        return (
            <main>
                <h1>Eventos em React</h1>
                <Alert1 />
            </main>
        )
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>

    
</body>
</html>
