<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketseat - React.js - Fundamentos</title>
</head>
<body>
    <div id="root"></div>

    <script scr="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        function Counter(){
          const [count, setCount] = React.useState (0);

          // Transforme as ações em função, fazendo assim o return ser mais limpo e simples
          function handleAdd(){
            setCount(count + 1);
          }

          function handleRemove(){
            setCount(count - 1);
          }

          return (
            <div>
              <h1>Contador: {count} </h1>
              <button type="button" onClick={handleAdd}>Adicionar</button>
              <button type="button" onClick={handleRemove}>Remover</button>
            </div>
          )
        }
      
        function App() {
        return (
            <main class ="P-3">
                <h1>Modelo de Aplicação</h1>
                <Counter />
            </main>
        )
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>

    
</body>
</html>
